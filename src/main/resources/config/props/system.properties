#########################################
#spring session redis
session.redis.host=${REDIS_HOST:localhost}
session.redis.port=${REDIS_PORT:6379}
session.redis.db=${REDIS_DB:0}
session.redis.pool.maxTotal=1000
session.redis.pool.maxIdle=100
session.redis.pool.minIdle=10
session.redis.pool.maxWaitMillis=1000
session.redis.pool.timeBetweenEvictionRunsMillis=1800000
#########################################
#rabbitmq
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USERNAME:guest}
rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.virtualhost=${RABBITMQ_VIRTUALHOST:/}
#########################################
#qiniu
qiniu.ak=${QINIU_AK:Mz8BDzozvcvNsiEnR7nI80cln2k595N0JV1K_zpO}
qiniu.sk=${QINIU_SK:OKFVNRnriK_wcmSqKXKop2cTSnVpNyZDQzWups35}
qiniu.bucket=${QINIU_BUCKET:andc-develop}
#\u56FE\u7247\u6587\u4EF6\u5927\u5C0F\u6700\u5927\u503C150kb\uFF0C\u5355\u4F4D\uFF1A\u5B57\u8282\uFF08Byte\uFF09
qiniu.image.policy.fsizeLimit=153600
#\u89C6\u9891\u6587\u4EF6\u5927\u5C0F\u6700\u5927\u503C32mb\uFF0C\u5355\u4F4D\uFF1A\u5B57\u8282\uFF08Byte\uFF09
qiniu.video.policy.fsizeLimit=33554432
qiniu.image.policy.returnBody={"w":"$(imageInfo.width)","h":"$(imageInfo.height)","format":"$(imageInfo.format)","key":"$(key)","etag":"$(etag)","mimeType":"$(mimeType)","ext":"$(ext)","uuid":"$(uuid)"}
qiniu.video.policy.returnBody={"w":"$(avinfo.video.width)","h":"$(avinfo.video.height)","format":"$(avinfo.format.format_name)","key":"$(key)","etag":"$(etag)","mimeType":"$(mimeType)","ext":"$(ext)","uuid":"$(uuid)","duration1":"$(avinfo.format.duration)","duration2":"$(avinfo.video.duration)"}
qiniu.cdn.host=qiniu.adcore.i-xad.com
